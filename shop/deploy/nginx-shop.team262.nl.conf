# Nginx-configuratie voor shop.team262.nl
# Plaats als /etc/nginx/sites-available/shop.team262.nl en activeer met:
#   sudo ln -s /etc/nginx/sites-available/shop.team262.nl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shop.team262.nl
#
# De shop draait op poort 3001 (alleen lokaal bereikbaar), naast team262.nl op 3000.

server {
    listen 80;
    server_name shop.team262.nl;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
